<main class="wrap">
  <nav class="crumbs" aria-label="導覽"><a href="../">MechanicalAI</a><span>/</span><span>機構學</span></nav>

  <header class="hero">
    <span class="eyebrow">Mechanisms</span>
    <h1>機構學</h1>
    <p class="lead">把傳動機構做成可以 3D 列印、親手轉動的模型，再用動畫拆解它的組裝順序與運作原理。</p>
  </header>

  <section class="grid" aria-label="機構模型">
    <a class="card" href="differential/">
      <div class="media"><img src="differential/thumb.jpg" width="960" height="600" alt="傘齒輪差速器組合模型：底座、大齒輪、曲柄與兩個輪子"></div>
      <div class="body">
        <h2>差速器<span class="en">Differential</span></h2>
        <ul>
          <li>12 步組裝動畫，零件依序飛入定位</li>
          <li>4 種運轉情境：直行、轉彎、單輪卡住、殼固定</li>
          <li>減速比 <strong>3 : 1</strong>，殼轉速 = 兩輪平均</li>
        </ul>
        <div class="meta"><span class="tag">傘齒輪 Bevel Gear</span><span class="tag">LEGO 十字軸</span><span class="tag">3D 列印</span></div>
        <span class="go">開啟動畫 →</span>
      </div>
    </a>
  </section>

  <footer>模型以 text-to-cad（OpenCascade）建模、FreeCAD 參數化曲柄；齒輪咬合經干涉與轉動模擬檢查</footer>
